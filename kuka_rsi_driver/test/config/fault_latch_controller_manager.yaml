# Test-only controller manager settings for the RSI fault-latch tests: the cell's
# deactivate_controllers_on_hardware_self_deactivate, so a DEACTIVATE from write() takes
# down the controllers holding command interfaces and nothing else.
/**/controller_manager:
  ros__parameters:
    update_rate: 250  # Hz

    defaults:
      allow_controller_activation_with_inactive_hardware: false
      deactivate_controllers_on_hardware_self_deactivate: true

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    stop_reason_broadcaster:
      type: gpio_controllers/GpioCommandController

    overruns:
      print_warnings: false
