name: Lyrical CI
run-name: Lyrical CI - ${{ github.event_name }}

# Builds the RSI driver against the same Lyrical apt snapshot and dependency pins
# amp_robot's manipulator uses then runs kuka_rsi_driver's launch tests
# against kuka_rsi_simulator.

on:
  push:
    branches:
      - amp/lyrical
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write

env:
  # Keep in sync with amp_robot's manipulator lyrical references
  ROS_APT_SNAPSHOT_DATE: "2026-09-18"
  UBUNTU_CODENAME: resolute
  SDK_REPO: https://github.com/kuka-amp-forks/kuka_external_control_sdk.git
  SDK_REF: c7f4ff7f822c7c57297562e3561a38f4e3848562
  DESC_REPO: https://github.com/kuka-amp-forks/kuka_robot_descriptions.git
  DESC_REF: d8b41feab96dad453b188a4d192ab95736d473eb
  RMW_IMPLEMENTATION: rmw_zenoh_cpp
  # From ros2-testing for the Zenoh freeze fix; drop once the snapshot carries 0.10.7.
  ZENOH_PKG_VERSION: "0.10.7-1resolute.20261024.194644"
  ZENOH_VENDOR_PKG_VERSION: "0.10.7-1resolute.20261024.164443"

jobs:
  build_test:
    name: Build and test on Lyrical
    runs-on: ubuntu-latest
    container:
      image: ros@sha256:0c19f326a339ed770ef1d4c0646a8b53bdb49dd5ff74b6de41ebdb8ac21e1806
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out kuka_drivers
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ws/src/kuka_drivers

      - name: Pin apt to the ROS snapshot and install build tools
        run: |
          set -euo pipefail
          rm -f /etc/apt/sources.list.d/ros2*.list /etc/apt/sources.list.d/ros2*.sources
          echo "deb [trusted=yes] http://snapshots.ros.org/${ROS_DISTRO}/${ROS_APT_SNAPSHOT_DATE}/ubuntu ${UBUNTU_CODENAME} main" \
            > /etc/apt/sources.list.d/ros2-snapshot.list
          # Testing at low priority, so only the two pinned packages come from it.
          echo "deb [trusted=yes] http://packages.ros.org/ros2-testing/ubuntu ${UBUNTU_CODENAME} main" \
            > /etc/apt/sources.list.d/ros2-testing.list
          # Match by host, not Release Origin, which testing shares with the snapshot.
          cat > /etc/apt/preferences.d/ros2-testing <<'EOF'
          Package: *
          Pin: origin "packages.ros.org"
          Pin-Priority: 1
          EOF
          apt-get update -qq
          ros_pkgs=$(apt list --upgradable 2>/dev/null | grep -oP "^ros-${ROS_DISTRO}-[^/]+" || true)
          if [ -n "${ros_pkgs}" ]; then
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --only-upgrade \
              -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold ${ros_pkgs}
          fi
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git python3-vcstool python3-colcon-common-extensions python3-rosdep \
            "ros-${ROS_DISTRO}-zenoh-cpp-vendor=${ZENOH_VENDOR_PKG_VERSION}" \
            "ros-${ROS_DISTRO}-rmw-zenoh-cpp=${ZENOH_PKG_VERSION}"

      - name: Verify the pinned rmw_zenoh_cpp versions
        run: |
          set -euo pipefail
          installed_zenoh=$(dpkg-query -W -f='${Version}' "ros-${ROS_DISTRO}-rmw-zenoh-cpp")
          installed_vendor=$(dpkg-query -W -f='${Version}' "ros-${ROS_DISTRO}-zenoh-cpp-vendor")
          echo "ros-${ROS_DISTRO}-rmw-zenoh-cpp: ${installed_zenoh} (expected ${ZENOH_PKG_VERSION})"
          echo "ros-${ROS_DISTRO}-zenoh-cpp-vendor: ${installed_vendor} (expected ${ZENOH_VENDOR_PKG_VERSION})"
          [ "${installed_zenoh}" = "${ZENOH_PKG_VERSION}" ]
          [ "${installed_vendor}" = "${ZENOH_VENDOR_PKG_VERSION}" ]

      - name: Fetch the SDK and the robot descriptions at their pins
        run: |
          set -euo pipefail
          git clone -q "${SDK_REPO}" ws/src/kuka_external_control_sdk
          git -C ws/src/kuka_external_control_sdk checkout -q "${SDK_REF}"
          git clone -q "${DESC_REPO}" ws/src/kuka_robot_descriptions
          git -C ws/src/kuka_robot_descriptions checkout -q "${DESC_REF}"
          for d in kuka_drivers kuka_external_control_sdk kuka_robot_descriptions; do
            echo "$d $(git -C ws/src/$d rev-parse --short HEAD)"
          done

      - name: rosdep
        run: |
          set -euo pipefail
          rosdep init 2>/dev/null || true
          rosdep update --rosdistro "${ROS_DISTRO}"
          rosdep install --from-paths ws/src --ignore-src -y --rosdistro "${ROS_DISTRO}"
          dpkg-query -W -f='${Package} ${Version}\n' \
            ros-${ROS_DISTRO}-controller-manager ros-${ROS_DISTRO}-hardware-interface \
            ros-${ROS_DISTRO}-joint-trajectory-controller ros-${ROS_DISTRO}-rmw-zenoh-cpp
          # Fail if any unpinned installed version isn't also in the snapshot.
          allowed="ros-${ROS_DISTRO}-rmw-zenoh-cpp ros-${ROS_DISTRO}-zenoh-cpp-vendor"
          leaked=""
          for pkg in $(dpkg-query -W -f='${db:Status-Status} ${Package}\n' "ros-${ROS_DISTRO}-*" 2>/dev/null \
              | awk '$1=="installed"{print $2}'); do
            case " ${allowed} " in *" ${pkg} "*) continue ;; esac
            ver=$(dpkg-query -W -f='${Version}' "${pkg}")
            if ! apt-cache madison "${pkg}" | awk -v v="${ver}" -F' \\| ' '$2==v' | grep -q snapshots.ros.org; then
              leaked="${leaked} ${pkg}=${ver}"
            fi
          done
          if [ -n "${leaked}" ]; then
            echo "Packages installed from ros2-testing beyond the pinned two:${leaked}" >&2
            exit 1
          fi

      - name: colcon build
        run: |
          set -eo pipefail +u
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          cd ws
          colcon build --merge-install --event-handlers console_cohesion+ \
            --cmake-args -DCMAKE_BUILD_TYPE=Release

      - name: colcon test (with a Zenoh router)
        run: |
          set -eo pipefail +u
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          cd ws
          source install/setup.bash
          # The launch tests publish and subscribe over rmw_zenoh; without a router
          # nothing discovers anything and every test times out on robot_description.
          ros2 run rmw_zenoh_cpp rmw_zenohd > zenohd.log 2>&1 &
          sleep 3
          # Only select kuka_rsi_simulator once it has tests of its own.
          pkgs="kuka_rsi_driver"
          [ -d src/kuka_drivers/kuka_rsi_simulator/test ] && pkgs="${pkgs} kuka_rsi_simulator"
          colcon test --merge-install --packages-select ${pkgs} \
            --executor sequential --event-handlers console_cohesion+
          results=$(colcon test-result --all --verbose)
          printf '%s\n' "${results}"
          colcon test-result --all
          count=$(printf '%s\n' "${results}" | sed -n 's/^Summary: \([0-9][0-9]*\) tests\?,.*/\1/p')
          echo "colcon recorded ${count:-0} tests"
          {
            echo "### Test results"
            echo '```'
            printf '%s\n' "${results}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          # Every add_launch_test() in kuka_rsi_driver must be registered, not just one.
          expected=$(grep -c '^\s*add_launch_test(' \
            src/kuka_drivers/kuka_rsi_driver/CMakeLists.txt)
          registered=$(ctest --test-dir build/kuka_rsi_driver -N \
            | sed -n 's/^Total Tests: \([0-9][0-9]*\)/\1/p')
          echo "kuka_rsi_driver: expected >= ${expected} launch tests, ctest registered ${registered:-0}"
          [ "${count:-0}" -ge 1 ]
          [ "${registered:-0}" -ge "${expected}" ]

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            ws/build/kuka_rsi_driver/test_results/**/*.xml
            ws/build/kuka_rsi_simulator/pytest.xml
          if-no-files-found: warn
